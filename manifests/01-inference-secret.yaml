# 세 트랙(pgvector/FAISS/Qdrant)이 공용으로 쓰는 추론 백엔드 접속 정보.
# 40-qwen-vllm.yaml로 띄운 Qwen2.5-3B-Instruct(vLLM)를 가리킨다. 이 데모의 핵심(vector_io)과는
# 별개로, 검색된 문서를 근거로 실제 답변까지 생성하는 완전한 RAG를 보여주기 위해 추가했다.
# qwen-vllm 배포 전에는 존재하지 않는 더미 값(unused / unused-inference.invalid)을 넣어도
# rh-dev 배포판은 부팅 시 연결 확인을 하지 않으므로 파드가 정상 Ready가 된다
# (vector_io만 검증하면 되는 경우 이 방식을 다시 써도 된다).
apiVersion: v1
kind: Secret
metadata:
  name: inference-model-secret
  namespace: rag-support-demo
type: Opaque
stringData:
  INFERENCE_MODEL: "qwen2.5-3b"
  VLLM_URL: "http://qwen-vllm.rag-support-demo.svc.cluster.local:8000/v1"
