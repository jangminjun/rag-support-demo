# ③ Qdrant 트랙: RHOAI 3.4 Technology Preview. Inline은 미지원이므로 반드시 remote로 배포해야 한다.
# 이미지는 이 클러스터에서 pull 가능함이 검증된 docker.io/qdrant/qdrant:latest 사용.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-data
  namespace: rag-support-demo
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: rag-support-demo
  labels: {app: qdrant, track: qdrant}
spec:
  replicas: 1
  selector:
    matchLabels: {app: qdrant}
  template:
    metadata:
      labels: {app: qdrant, track: qdrant}
    spec:
      containers:
        - name: qdrant
          image: docker.io/qdrant/qdrant:latest
          ports:
            - containerPort: 6333
              name: http
            - containerPort: 6334
              name: grpc
          env:
            # OpenShift의 restricted SCC(임의 비루트 UID)에서는 이미지 내부의 /qdrant 디렉터리
            # (스냅샷 임시 경로 등)에 쓰기 권한이 없다. PVC로 마운트된 /qdrant/storage만 쓰기 가능하므로
            # 스냅샷 경로를 그 아래로 옮긴다.
            - name: QDRANT__STORAGE__SNAPSHOTS_PATH
              value: /qdrant/storage/snapshots
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 1Gi}
          readinessProbe:
            httpGet: {path: /readyz, port: 6333}
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: qdrant-data}
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: rag-support-demo
spec:
  selector: {app: qdrant}
  ports:
    - name: http
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
