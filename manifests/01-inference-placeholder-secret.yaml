# 이 데모는 벡터 저장소(vector_io) API만 검증하며 실제 LLM 추론(채팅/생성)은 호출하지 않는다.
# 그런데도 INFERENCE_MODEL/VLLM_URL을 요구하는 이유는 rh-dev 배포판이 inference API도 함께
# 부팅 시 등록하기 때문이다 — 다만 llama-stack은 이 값에 대해 부팅 시 연결 확인(health check)을
# 하지 않으므로(provider.health == "Not Implemented"), 실제로 존재하지 않는 더미 값을 넣어도
# 파드는 정상적으로 Ready 상태가 된다. 별도 vLLM을 새로 띄우거나 다른 네임스페이스의 vLLM을
# 재사용할 필요가 없다.
apiVersion: v1
kind: Secret
metadata:
  name: inference-model-secret
  namespace: rag-support-demo
type: Opaque
stringData:
  INFERENCE_MODEL: "unused"
  VLLM_URL: "http://unused-inference.invalid:8080/v1"
