# pgvector 트랙: pgvector 확장이 사전 설치된 PostgreSQL.
# 이 인스턴스 하나를 llama-stack의 메타데이터 저장소(POSTGRES_*)와
# 벡터 저장소(PGVECTOR_*) 양쪽에 동시에 사용한다 (실제로도 pgvector는 "그냥 Postgres 확장"이라
# 같은 인스턴스를 공유해도 무방함을 보여주는 지점이기도 하다).
#
# 데모 전용 자격 증명이다: ClusterIP로만 노출되고 클러스터 외부에서 접근 불가능하므로
# 여기 담긴 값은 실제 운영 비밀이 아니다. 운영 환경에서는 절대 재사용하지 말 것.
apiVersion: v1
kind: Secret
metadata:
  name: pgvector-postgres-credentials
  namespace: rag-support-demo
type: Opaque
stringData:
  POSTGRES_DB: "llamastack"
  POSTGRES_USER: "llamastack"
  POSTGRES_PASSWORD: "pgvector-demo-pw-8f2a"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgvector-postgres-data
  namespace: rag-support-demo
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgvector-postgres
  namespace: rag-support-demo
  labels: {app: pgvector-postgres, track: pgvector}
spec:
  replicas: 1
  selector:
    matchLabels: {app: pgvector-postgres}
  template:
    metadata:
      labels: {app: pgvector-postgres, track: pgvector}
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef: {name: pgvector-postgres-credentials}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 1Gi}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "llamastack"]}
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: pgvector-postgres-data}
---
apiVersion: v1
kind: Service
metadata:
  name: pgvector-postgres
  namespace: rag-support-demo
spec:
  selector: {app: pgvector-postgres}
  ports:
    - port: 5432
      targetPort: 5432
